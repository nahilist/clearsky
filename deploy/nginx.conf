# Docker's DNS returns every replica of "api"; re-resolve often so scaling up or down is picked up.
resolver 127.0.0.11 valid=5s ipv6=off;
server {
  listen 80;
  set $upstream http://api:8080;
  client_max_body_size 16k;
  location / {
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for rate limiting
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_502 http_503;
  }
}
