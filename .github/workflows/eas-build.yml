name: Mobile App EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS Build Profile (eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build-app:
    name: Build Mobile App (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install App Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run EAS Build
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
