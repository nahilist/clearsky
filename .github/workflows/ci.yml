name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ============================================================================
  # 1. CHANGE DETECTION (Path Filtering for Monorepo Efficiency)
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      shared: ${{ steps.filter.outputs.shared }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            shared:
              - 'app/src/shared/**'
            docker:
              - 'server/Dockerfile'
              - 'docker-compose.yml'
              - 'deploy/**'

  # ============================================================================
  # 2. SECURITY & SECRET SCANNING
  # ============================================================================
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # 3. MOBILE APP (React Native / Expo) QUALITY GATE
  # ============================================================================
  app-ci:
    name: Mobile App (Expo SDK 58)
    needs: [changes]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Validate Expo Configuration
        run: npx expo config --type public

      - name: Bundle Dry-Run (Mobile Export)
        run: npx expo export --platform android --output-dir dist-dry-run

  # ============================================================================
  # 4. BACKEND SERVER (Fastify + Postgres API) QUALITY GATE
  # ============================================================================
  server-ci:
    name: Backend Server (Fastify + DB)
    needs: [changes]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clearsky
          POSTGRES_PASSWORD: clearsky_ci_password
          POSTGRES_DB: clearsky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Integration & Unit Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://clearsky:clearsky_ci_password@localhost:5432/clearsky_test
          METRICS_TOKEN: ci_metrics_token_secret
        run: npm test

      - name: Build Production Distribution
        run: npm run build

      - name: Verify Dist Artifact
        run: test -f dist/main.mjs

  # ============================================================================
  # 5. DOCKER CONTAINER VERIFICATION
  # ============================================================================
  docker-check:
    name: Docker Build Validation
    needs: [changes]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: clearsky-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
